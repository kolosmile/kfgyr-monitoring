name: Relay runner image
on:
  push:
    branches: [main]
    paths: ['services/relay-runner/**', '.github/workflows/relay-runner.yml']
    tags: ['relay-runner-v*']
  pull_request:
    paths: ['services/relay-runner/**', '.github/workflows/relay-runner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Test configuration protocol
        working-directory: services/relay-runner
        run: python3 -m unittest -v
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select version
        id: version
        shell: bash
        run: |
          VERSION="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/relay-runner-v* ]]; then VERSION="${GITHUB_REF_NAME#relay-runner-v}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/relay-runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/kfgyr-relay-runner:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
