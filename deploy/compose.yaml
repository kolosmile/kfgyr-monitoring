services:
  db:
    image: timescale/timescaledb:2.30.1-pg16
    environment:
      POSTGRES_DB: ladder99
      POSTGRES_USER: ladder99
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, ladder99, -d, ladder99]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      options: {max-size: 20m, max-file: "5"}

  relay:
    image: ${KFGYR_RELAY_RUNNER_IMAGE:-ghcr.io/kolosmile/kfgyr-relay-runner:0.1.1}
    environment:
      KFGYR_CONFIG_DIR: /var/lib/kfgyr-monitoring
      KFGYR_RELAY_STARTUP_SECONDS: "10"
      FETCH_INTERVAL: "2000"
      FETCH_COUNT: "1000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ladder99
      PGUSER: ladder99
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - relay-config:/var/lib/kfgyr-monitoring
    depends_on:
      db: {condition: service_healthy}
    stop_grace_period: 25s
    restart: unless-stopped
    logging:
      options: {max-size: 20m, max-file: "5"}

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: ${KFGYR_PLUGIN_INSTALL:-kfgyr-monitoring-app@0.2.0@https://github.com/kolosmile/kfgyr-monitoring/releases/download/plugin-v0.2.0/kfgyr-monitoring-app-0.2.0.zip}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: kfgyr-monitoring-app
      KFGYR_CONFIG_DIR: /var/lib/kfgyr-monitoring
      KFGYR_ADMIN_ORG_ID: ${KFGYR_ADMIN_ORG_ID:-1}
      KFGYR_AGENT_ALLOWED_HOSTS: ${KFGYR_AGENT_ALLOWED_HOSTS:-demo.mtconnect.org}
      KFGYR_AGENT_ALLOWED_NETWORKS: ${KFGYR_AGENT_ALLOWED_NETWORKS:-192.168.88.0/24,100.64.0.0/10}
    volumes:
      - grafana-data:/var/lib/grafana
      - relay-config:/var/lib/kfgyr-monitoring
    configs:
      - source: monitoring_app
        target: /etc/grafana/provisioning/plugins/kfgyr-monitoring.yaml
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    logging:
      options: {max-size: 20m, max-file: "5"}

volumes:
  timescaledb-data: {}
  grafana-data: {}
  relay-config:
    external: true
    name: ${KFGYR_CONFIG_VOLUME:-kfgyr-monitoring-config}

configs:
  monitoring_app:
    content: |
      apiVersion: 1
      apps:
        - type: kfgyr-monitoring-app
          org_id: ${KFGYR_ADMIN_ORG_ID:-1}
          disabled: false
          pinned: true
